<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>K-Golf 워치 홀 기록</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8CC48A}a:hover{color:#B5DDB3}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 360px; height: 360px; border-radius: 50%; background: #000000; color: #FFFFFF; font-family: 'IBM Plex Sans KR', sans-serif; position: relative; overflow: hidden">
  <svg width="360" height="360" viewBox="0 0 360 360" aria-hidden="true" style="position: absolute; left: 0; top: 0">
    <g transform="rotate(-90 180 180)">
      <circle cx="180" cy="180" r="170" fill="none" stroke="#26332B" stroke-width="7" stroke-dasharray="55.34 4"></circle>
      <circle cx="180" cy="180" r="170" fill="none" stroke="{{accent}}" stroke-width="7" stroke-dasharray="55.34 4 55.34 4 55.34 4 55.34 4 55.34 4 55.34 4 0 1100"></circle>
      <circle cx="180" cy="180" r="170" fill="none" stroke="#F2C14E" stroke-width="7" stroke-dasharray="0 356.04 55.34 1100"></circle>
    </g>
  </svg>

  <div style="position: absolute; left: 0; right: 0; top: 24px; display: flex; flex-direction: column; align-items: center; gap: 2px">
    <div style="display: flex; align-items: center; gap: 5px; font-size: 11px; color: #9AA59C">
      <div style="width: 6px; height: 6px; border-radius: 3px; background: #4CAF50"></div>
      폰 연결됨
    </div>
    <div style="display: flex; align-items: center; gap: 8px">
      <a href="WatchHole.dc.html" aria-label="이전 홀" style="width: 44px; height: 44px; border-radius: 22px; background: #1E2A22; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 96px">
        <div style="font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 700; line-height: 1">HOLE 7</div>
        <div style="font-size: 12px; font-weight: 600; color: #000000; background: #F2C14E; border-radius: 999px; padding: 0 8px">파 4</div>
      </div>
      <a href="WatchHole.dc.html" aria-label="다음 홀" style="width: 44px; height: 44px; border-radius: 22px; background: #1E2A22; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg>
      </a>
    </div>
  </div>

  <div style="position: absolute; left: 36px; right: 36px; top: 100px; display: flex; flex-direction: column; gap: 6px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 6px">
        <div style="flex: 1; font-size: 17px; font-weight: 600; color: #FFFFFF; padding-left: 6px">{{r.label}}</div>
        <button onClick="{{r.dec}}" aria-label="{{r.label}} 빼기" style="width: 46px; height: 46px; border-radius: 23px; border: none; background: #1E2A22; color: #FFFFFF; font-size: 24px; display: flex; align-items: center; justify-content: center">−</button>
        <div style="font-family: 'Barlow Condensed', sans-serif; font-size: 40px; font-weight: 700; line-height: 1; width: 34px; text-align: center">{{r.value}}</div>
        <button onClick="{{r.inc}}" aria-label="{{r.label}} 더하기" style="width: 46px; height: 46px; border-radius: 23px; border: none; background: {{accent}}; color: #FFFFFF; font-size: 24px; display: flex; align-items: center; justify-content: center">+</button>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 38px; display: flex; justify-content: center">
    <div style="font-size: 12px; font-weight: 600">이 홀 <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 16px">{{holeTotal}}</span> · {{holeName}} <span style="color: #9AA59C; font-weight: 400">· 합계</span> <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 16px">{{total}}</span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2E7D4F","options":["#2E7D4F","#1F5C3F","#0F7C8C"]},"$preview":{"width":360,"height":360}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { toGreen: 2, shortGame: 1, putt: 2 };
  }
  renderVals() {
    const { toGreen, shortGame, putt } = this.state;
    const par = 4;
    const before = 5;
    const hole = toGreen + shortGame + putt;
    const diff = hole - par;
    const names = { '-3': '앨버트로스', '-2': '이글', '-1': '버디', '0': '파', '1': '보기', '2': '더블', '3': '트리플' };
    const name = names[String(diff)] || (diff > 0 ? '+' + diff : String(diff));
    const total = before + (hole > 0 ? diff : 0);
    const set = (k, d) => () => this.setState({ [k]: Math.max(0, this.state[k] + d) });
    return {
      accent: this.props.accent ?? '#2E7D4F',
      rows: [
        { label: '그린까지', value: toGreen, dec: set('toGreen', -1), inc: set('toGreen', 1) },
        { label: '숏게임', value: shortGame, dec: set('shortGame', -1), inc: set('shortGame', 1) },
        { label: '퍼팅', value: putt, dec: set('putt', -1), inc: set('putt', 1) }
      ],
      holeTotal: hole + '타',
      holeName: hole > 0 ? name : '-',
      total: (total > 0 ? '+' : '') + total
    };
  }
}
</script>
</body>
</html>
