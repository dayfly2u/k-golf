<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>K-Golf 홈</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F5C3F}a:hover{color:#123A28}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5EF; font-family: 'IBM Plex Sans KR', sans-serif; color: #18241D; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="background: {{accent}}; color: #FFFFFF; padding: 22px 20px 20px; display: flex; flex-direction: column; gap: 14px; border-radius: 0 0 26px 26px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="display: flex; align-items: center; gap: 10px">
        <div style="width: 32px; height: 32px; border-radius: 10px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F5C3F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 21V3l10 4-10 4"/><path d="M4 21h12"/></svg>
        </div>
        <div style="font-size: 20px; font-weight: 700; letter-spacing: -0.3px">K-Golf</div>
      </div>
      <button style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.35); background: transparent; color: #FFFFFF; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 6px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
        코스 관리
      </button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div style="background: rgba(255,255,255,0.12); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px">
        <div style="font-size: 12px; opacity: 0.85">평균 스코어</div>
        <div style="font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 700; line-height: 1">94.8</div>
      </div>
      <div style="background: rgba(255,255,255,0.12); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px">
        <div style="font-size: 12px; opacity: 0.85">베스트</div>
        <div style="font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 700; line-height: 1">89</div>
      </div>
      <div style="background: rgba(255,255,255,0.12); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px">
        <div style="font-size: 12px; opacity: 0.85">평균 퍼팅</div>
        <div style="font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 700; line-height: 1">33.2</div>
      </div>
    </div>
  </div>

  <div style="padding: 16px 20px 8px; display: flex; justify-content: space-between; align-items: baseline">
    <div style="font-size: 17px; font-weight: 700">최근 라운드</div>
    <div style="font-size: 12px; color: #56635A">총 4회</div>
  </div>

  <div style="padding: 0 16px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{rounds}}" as="r" hint-placeholder-count="4">
      <button onClick="{{r.toggle}}" style="width: 100%; text-align: left; border: none; background: #FFFFFF; border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 1px 2px rgba(24,36,29,0.06); color: #18241D">
        <div style="display: flex; align-items: center; gap: 12px; width: 100%">
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
            <div style="font-size: 16px; font-weight: 600">{{r.course}}</div>
            <div style="font-size: 13px; color: #3F4B43; display: flex; align-items: center; gap: 5px">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
              {{r.time}}
            </div>
          </div>
          <div style="{{r.badgeStyle}}">
            <div style="font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 700; line-height: 1">{{r.score}}</div>
            <div style="font-size: 11px; font-weight: 600">{{r.toPar}}</div>
          </div>
        </div>
        <sc-if value="{{r.open}}" hint-placeholder-val="{{ false }}">
          <div style="width: 100%; height: 1px; background: #ECEFE7"></div>
          <div style="font-size: 12px; color: #56635A">{{r.info}}</div>
        </sc-if>
        <sc-if value="{{r.showReview}}" hint-placeholder-val="{{ false }}">
          <div style="{{r.reviewStyle}}">{{r.review}}</div>
        </sc-if>
        <sc-if value="{{r.showWrite}}" hint-placeholder-val="{{ false }}">
          <div style="font-size: 13px; color: #1F5C3F; font-weight: 600; display: flex; align-items: center; gap: 5px">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
            리뷰 남기기
          </div>
        </sc-if>
        <sc-if value="{{r.open}}" hint-placeholder-val="{{ false }}">
          <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; width: 100%">
            <sc-for list="{{r.stats}}" as="s" hint-placeholder-count="4">
              <div style="background: #F4F5EF; border-radius: 10px; padding: 6px 4px; display: flex; flex-direction: column; align-items: center">
                <div style="font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 700; line-height: 1.1">{{s.value}}</div>
                <div style="font-size: 11px; color: #56635A">{{s.label}}</div>
              </div>
            </sc-for>
          </div>
          <div style="font-size: 13px; font-weight: 600; color: #1F5C3F; align-self: flex-end">상세 결과 보기 ›</div>
        </sc-if>
      </button>
    </sc-for>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 22px">
    <button style="width: 100%; height: 58px; border: none; border-radius: 18px; background: {{cta}}; color: #18241D; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 6px 16px rgba(24,36,29,0.18)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      새 라운드 시작
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1F5C3F","options":["#1F5C3F","#0F4C5C","#2B3A55"]},"cta":{"editor":"color","default":"#F2C14E","options":["#F2C14E","#FFFFFF","#E8A87C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { openId: null };
  }
  renderVals() {
    const base = 'width: 64px; height: 64px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;';
    const best = base + ' background: #1F5C3F; color: #FFFFFF;';
    const good = base + ' background: #DCEBDD; color: #123A28;';
    const plain = base + ' background: #EEF0E8; color: #18241D;';
    const quote = 'width: 100%; box-sizing: border-box; background: #F7F4E8; border-radius: 12px; padding: 10px 12px; font-size: 13px; line-height: 1.55; color: #2C3830; overflow: hidden;';
    const clamp = quote + ' display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;';
    const data = [
      { id: 1, course: '파인크리크 (Valley-Pine)', time: '10.05 (일) 06:42~11:18 (4시간 36분)', info: '185,000원 | 민수, 지훈, 현우', score: 97, badgeStyle: plain,
        review: '전반은 드라이버가 좋았는데 후반 들어 슬라이스가 계속 났다. 그린 주변 어프로치에서 뒤땅이 3번. 다음엔 52도로 굴리는 연습부터 하자. 퍼팅 거리감은 괜찮았음.',
        stats: [{ value: '22%', label: 'GIR' }, { value: '34', label: '퍼팅' }, { value: '218m', label: '드라이버' }, { value: '2', label: '벌타' }] },
      { id: 2, course: '킹스데일 (Lake-Hill)', time: '09.27 (토) 07:10~11:52 (4시간 42분)', info: '210,000원 | 회사 동기 모임', score: 94, badgeStyle: good,
        review: '레이크 코스 4번 홀에서 OB 두 번. 티샷 공략을 왼쪽으로 잡는 게 맞았다. 후반 퍼팅 감이 살아나서 3퍼트가 1번뿐이었음.',
        stats: [{ value: '28%', label: 'GIR' }, { value: '33', label: '퍼팅' }, { value: '224m', label: '드라이버' }, { value: '3', label: '벌타' }] },
      { id: 3, course: '세일 (들길-산길)', time: '09.13 (토) 12:24~17:15 (4시간 51분)', info: '160,000원', score: 99, badgeStyle: plain, review: '',
        stats: [{ value: '17%', label: 'GIR' }, { value: '35', label: '퍼팅' }, { value: '209m', label: '드라이버' }, { value: '4', label: '벌타' }] },
      { id: 4, course: '태광 (북서)', time: '08.30 (토) 06:30~10:58 (4시간 28분)', info: '175,000원 | 가족', score: 89, badgeStyle: best,
        review: '첫 80대! 숏게임 타수가 줄어든 게 결정적이었다.',
        stats: [{ value: '33%', label: 'GIR' }, { value: '31', label: '퍼팅' }, { value: '226m', label: '드라이버' }, { value: '1', label: '벌타' }] }
    ];
    return {
      accent: this.props.accent ?? '#1F5C3F',
      cta: this.props.cta ?? '#F2C14E',
      rounds: data.map((r) => {
        const open = this.state.openId === r.id;
        return {
          ...r,
          open,
          toPar: '+' + (r.score - 72),
          showReview: open && r.review.length > 0,
          showWrite: open && r.review.length === 0,
          reviewStyle: quote,
          toggle: () => this.setState({ openId: open ? null : r.id })
        };
      })
    };
  }
}
</script>
</body>
</html>
