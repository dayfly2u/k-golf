<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>K-Golf 라운드 결과</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F5C3F;text-decoration:none}a:hover{color:#123A28}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5EF; font-family: 'IBM Plex Sans KR', sans-serif; color: #18241D; display: flex; flex-direction: column; overflow: hidden">
  <div style="background: {{accent}}; color: #FFFFFF; padding: 10px 12px 18px; border-radius: 0 0 26px 26px; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; align-items: center; gap: 4px">
      <a href="Main.dc.html" aria-label="홈으로" style="width: 44px; height: 44px; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <div style="display: flex; flex-direction: column">
        <div style="font-size: 16px; font-weight: 600">킹스데일 (Lake-Hill)</div>
        <div style="font-size: 12px; opacity: 0.85">09.27 (토) 07:10~11:52 (4시간 42분)</div>
      </div>
    </div>
    <div style="display: flex; align-items: flex-end; gap: 14px; padding: 0 12px">
      <div style="font-family: 'Barlow Condensed', sans-serif; font-size: 76px; font-weight: 700; line-height: 0.9">94</div>
      <div style="display: flex; flex-direction: column; gap: 4px; padding-bottom: 4px">
        <div style="font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 600; line-height: 1">+22</div>
        <div style="font-size: 12px; background: #F2C14E; color: #18241D; font-weight: 700; padding: 3px 8px; border-radius: 999px">최근 5회 중 2위</div>
      </div>
    </div>
  </div>

  <div style="padding: 12px 16px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <sc-for list="{{stats}}" as="s" hint-placeholder-count="6">
      <div style="background: #FFFFFF; border-radius: 14px; padding: 8px 10px; display: flex; flex-direction: column; gap: 1px">
        <div style="font-size: 11px; color: #56635A">{{s.label}}</div>
        <div style="display: flex; align-items: baseline; gap: 4px">
          <div style="font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 700; line-height: 1.1">{{s.value}}</div>
          <div style="font-size: 11px; color: #56635A">{{s.sub}}</div>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="margin: 10px 16px 0; background: #FFFFFF; border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <div style="font-size: 14px; font-weight: 700">홀 결과 비율</div>
      <div style="font-size: 12px; color: #56635A">18홀 기준</div>
    </div>
    <div style="display: flex; height: 22px; border-radius: 8px; overflow: hidden; gap: 2px">
      <sc-for list="{{segments}}" as="r" hint-placeholder-count="4">
        <div style="{{r.seg}}">{{r.pct}}</div>
      </sc-for>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: #18241D">
      <sc-for list="{{ratios}}" as="r" hint-placeholder-count="5">
        <div style="display: flex; align-items: center; gap: 5px"><div style="{{r.chip}}"></div>{{r.label}} {{r.count}}</div>
      </sc-for>
    </div>
  </div>

  <div style="margin: 10px 16px 0; background: #FFFFFF; border-radius: 18px; padding: 10px 10px 8px; display: flex; flex-direction: column; gap: 4px">
    <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px">
      <div style="font-size: 14px; font-weight: 700">스코어카드</div>
      <div style="font-size: 11px; color: #56635A">홀을 누르면 샷 경로와 거리</div>
    </div>
    <sc-for list="{{halves}}" as="half" hint-placeholder-count="2">
      <div style="display: flex; flex-direction: column; gap: 3px; padding: 3px 0">
        <div style="display: grid; grid-template-columns: 34px repeat(9, minmax(0, 1fr)) 34px; font-size: 11px; color: #56635A; text-align: center">
          <div style="text-align: left; padding-left: 4px">{{half.name}}</div>
          <sc-for list="{{half.holes}}" as="h" hint-placeholder-count="9"><div>{{h.no}}</div></sc-for>
          <div>합</div>
        </div>
        <div style="display: grid; grid-template-columns: 34px repeat(9, minmax(0, 1fr)) 34px; font-size: 12px; color: #56635A; text-align: center">
          <div style="text-align: left; padding-left: 4px">파</div>
          <sc-for list="{{half.holes}}" as="h" hint-placeholder-count="9"><div>{{h.par}}</div></sc-for>
          <div>{{half.parSum}}</div>
        </div>
        <div style="display: grid; grid-template-columns: 34px repeat(9, minmax(0, 1fr)) 34px; align-items: center; justify-items: center">
          <div style="justify-self: start; padding-left: 4px; font-size: 12px; font-weight: 600">타수</div>
          <sc-for list="{{half.holes}}" as="h" hint-placeholder-count="9"><a href="Hole.dc.html" aria-label="{{h.no}}번 홀 보기" style="{{h.cell}}">{{h.score}}</a></sc-for>
          <div style="font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 700">{{half.sum}}</div>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="flex: 1"></div>
  <div style="padding: 0 16px 20px; display: flex; gap: 10px">
    <button style="flex: 1; height: 52px; border-radius: 16px; border: 1.5px solid #CDD3C8; background: transparent; color: #18241D; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      리뷰 쓰기
    </button>
    <button style="flex: 1; height: 52px; border-radius: 16px; border: none; background: #18241D; color: #FFFFFF; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/></svg>
      스코어카드 공유
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1F5C3F","options":["#1F5C3F","#0F4C5C","#2B3A55"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#1F5C3F';
    const base = "width: 28px; height: 28px; box-sizing: border-box; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-size: 17px; font-weight: 700;";
    const cellFor = (d) => d <= 0
      ? base + ' background: #FFFFFF; border: 1.5px solid #CDD3C8; color: #18241D;'
      : d === 1 ? base + ' background: #DCE6F1; color: #18241D;'
      : base + ' background: #6B8FB8; color: #FFFFFF;';
    const mk = (name, start, pars, scores) => {
      const holes = pars.map((p, i) => ({ no: start + i, par: p, score: scores[i], cell: cellFor(scores[i] - p) }));
      return { name, holes, parSum: pars.reduce((a, b) => a + b, 0), sum: scores.reduce((a, b) => a + b, 0) };
    };
    const light = { '#F2C14E': true, '#9DB8D6': true };
    const ratio = (label, count, color) => ({
      label, count,
      pct: Math.round(count * 100 / 18) + '%',
      chip: 'width: 9px; height: 9px; border-radius: 3px; background: ' + color + ';',
      seg: 'flex: ' + count + '; background: ' + color + '; color: ' + (light[color] ? '#18241D' : '#FFFFFF') + "; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700; overflow: hidden; white-space: nowrap;"
    });
    const ratios = [
      ratio('버디 이하', 0, '#F2C14E'),
      ratio('파', 3, accent),
      ratio('보기', 9, '#9DB8D6'),
      ratio('더블', 5, '#6B8FB8'),
      ratio('트리플+', 1, '#34506F')
    ];
    return {
      ratios,
      segments: ratios.filter((r) => r.count > 0),
      accent,
      stats: [
        { label: 'GIR', value: '22%', sub: '4/18' },
        { label: 'L-GIR', value: '33%', sub: '6/18' },
        { label: '퍼팅', value: '33', sub: '홀당 1.8' },
        { label: '드라이버 평균', value: '224', sub: 'm' },
        { label: '드라이버 최장', value: '251', sub: 'm' },
        { label: '벌타', value: '3', sub: 'OB 2 · 해저드 1' }
      ],
      halves: [
        mk('OUT', 1, [4, 4, 3, 5, 4, 4, 3, 4, 5], [5, 5, 4, 7, 4, 5, 4, 6, 7]),
        mk('IN', 10, [4, 5, 3, 4, 4, 4, 3, 5, 4], [5, 7, 3, 5, 7, 4, 4, 7, 5])
      ]
    };
  }
}
</script>
</body>
</html>
