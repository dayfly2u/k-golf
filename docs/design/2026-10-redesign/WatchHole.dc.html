<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>K-Golf 워치 홀 이동</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8CC48A}a:hover{color:#B5DDB3}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 360px; height: 360px; border-radius: 50%; background: #000000; color: #FFFFFF; font-family: 'IBM Plex Sans KR', sans-serif; position: relative; overflow: hidden">
  <svg width="360" height="360" viewBox="0 0 360 360" aria-hidden="true" style="position: absolute; left: 0; top: 0">
    <g transform="rotate(-90 180 180)">
      <circle cx="180" cy="180" r="170" fill="none" stroke="#26332B" stroke-width="7" stroke-dasharray="55.34 4"/>
      <circle cx="180" cy="180" r="170" fill="none" stroke="{{accent}}" stroke-width="7" stroke-dasharray="55.34 4 55.34 4 55.34 4 55.34 4 55.34 4 55.34 4 55.34 4 0 1100"/>
      <circle cx="180" cy="180" r="170" fill="none" stroke="#F2C14E" stroke-width="7" stroke-dasharray="0 415.38 55.34 1100"/>
    </g>
  </svg>

  <div style="position: absolute; left: 0; right: 0; top: 52px; text-align: center; font-size: 12px; color: #9AA59C">다음 홀로 이동</div>

  <button aria-label="이전 홀" style="position: absolute; left: 26px; top: 152px; width: 56px; height: 56px; border-radius: 28px; border: none; background: #1E2A22; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <button aria-label="다음 홀" style="position: absolute; right: 26px; top: 152px; width: 56px; height: 56px; border-radius: 28px; border: none; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
  </button>

  <div style="position: absolute; left: 90px; right: 90px; top: 92px; display: flex; flex-direction: column; align-items: center; gap: 4px">
    <div style="font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 600; color: #9AA59C; line-height: 1">HOLE</div>
    <div style="font-family: 'Barlow Condensed', sans-serif; font-size: 96px; font-weight: 700; line-height: 0.9">8</div>
    <div style="font-size: 14px; font-weight: 600; color: #000000; background: #F2C14E; border-radius: 999px; padding: 2px 12px">파 3</div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 44px; display: flex; flex-direction: column; align-items: center; gap: 3px">
    <div style="font-size: 12px; color: #9AA59C">7번 홀 <span style="color: #FFFFFF; font-weight: 600">4타 · 파</span></div>
    <div style="font-size: 12px; color: #9AA59C">합계 <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 700; color: #FFFFFF">+5</span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2E7D4F","options":["#2E7D4F","#1F5C3F","#0F7C8C"]},"$preview":{"width":360,"height":360}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#2E7D4F' };
  }
}
</script>
</body>
</html>
