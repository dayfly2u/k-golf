<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>K-Golf 홀 기록</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F5C3F}a:hover{color:#123A28}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5EF; font-family: 'IBM Plex Sans KR', sans-serif; color: #18241D; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 14px 12px 10px; display: flex; align-items: center; gap: 6px">
    <button aria-label="뒤로" style="width: 44px; height: 44px; border: none; background: transparent; color: #18241D; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div style="flex: 1; display: flex; align-items: baseline; gap: 8px">
      <div style="font-family: 'Barlow Condensed', sans-serif; font-size: 34px; font-weight: 700; line-height: 1">HOLE 7</div>
      <div style="font-size: 14px; font-weight: 600; color: #FFFFFF; background: {{accent}}; padding: 3px 10px; border-radius: 999px">파 4</div>
    </div>
    <div style="text-align: right; padding-right: 8px">
      <div style="font-size: 11px; color: #56635A">현재 스코어</div>
      <div style="font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 700; line-height: 1">+5</div>
    </div>
  </div>

  <div style="padding: 0 16px 10px; display: flex; gap: 4px">
    <sc-for list="{{holes}}" as="h" hint-placeholder-count="18">
      <div style="{{h.style}}"></div>
    </sc-for>
  </div>

  <div style="margin: 0 16px; height: 248px; border-radius: 22px; background: #2F5A3B; position: relative; overflow: hidden">
    <svg width="358" height="248" viewBox="0 0 358 248" role="img" aria-label="코스 지도 자리 (실제 앱에서는 위성 지도)">
      <rect width="358" height="248" fill="#2F5A3B"/>
      <path d="M70 230 C 90 170, 150 140, 180 110 S 250 50, 280 30" stroke="#5E9A62" stroke-width="58" fill="none" stroke-linecap="round"/>
      <ellipse cx="285" cy="34" rx="34" ry="24" fill="#8CC48A"/>
      <ellipse cx="220" cy="92" rx="16" ry="10" fill="#E8DDB5"/>
      <circle cx="292" cy="32" r="4" fill="#FFFFFF"/>
      <path d="M78 222 L 176 116" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="5 5"/>
      <circle cx="78" cy="222" r="7" fill="#F2C14E" stroke="#18241D" stroke-width="2"/>
      <circle cx="176" cy="116" r="7" fill="#F2C14E" stroke="#18241D" stroke-width="2"/>
    </svg>
    <div style="position: absolute; left: 12px; top: 12px; background: rgba(24,36,29,0.78); color: #FFFFFF; border-radius: 12px; padding: 8px 12px; display: flex; flex-direction: column; gap: 1px">
      <div style="font-size: 11px; opacity: 0.85">그린 중앙까지</div>
      <div style="font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 700; line-height: 1">142m</div>
    </div>
    <button style="position: absolute; right: 12px; bottom: 12px; height: 40px; padding: 0 14px; border: none; border-radius: 20px; background: #FFFFFF; color: #18241D; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
      위치 조정
    </button>
  </div>

  <div style="margin: 12px 16px 0; background: #FFFFFF; border-radius: 22px; padding: 6px 16px; display: flex; flex-direction: column">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
      <div style="{{r.rowStyle}}">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 1px">
          <div style="font-size: 16px; font-weight: 600">{{r.label}}</div>
          <div style="font-size: 12px; color: #56635A">{{r.hint}}</div>
        </div>
        <button aria-label="{{r.label}} 빼기" style="width: 48px; height: 48px; border-radius: 14px; border: 1.5px solid #CDD3C8; background: #FFFFFF; color: #18241D; font-size: 24px; font-weight: 500; display: flex; align-items: center; justify-content: center">−</button>
        <div style="width: 48px; text-align: center; font-family: 'Barlow Condensed', sans-serif; font-size: 38px; font-weight: 700">{{r.value}}</div>
        <button aria-label="{{r.label}} 더하기" style="width: 48px; height: 48px; border-radius: 14px; border: none; background: {{accent}}; color: #FFFFFF; font-size: 24px; font-weight: 500; display: flex; align-items: center; justify-content: center">+</button>
      </div>
    </sc-for>
  </div>

  <div style="margin: 10px 16px 0; display: flex; gap: 8px; align-items: center">
    <div style="font-size: 13px; color: #56635A; width: 40px">벌타</div>
    <button style="flex: 1; height: 44px; border-radius: 12px; border: 1.5px solid #E3A34A; background: #FFF6E8; color: #7A4A0C; font-size: 14px; font-weight: 600">OB +1</button>
    <button style="flex: 1; height: 44px; border-radius: 12px; border: 1.5px solid #E3A34A; background: #FFF6E8; color: #7A4A0C; font-size: 14px; font-weight: 600">OB +2</button>
    <button style="flex: 1; height: 44px; border-radius: 12px; border: 1.5px solid #6B8FB8; background: #EEF3F9; color: #24476E; font-size: 14px; font-weight: 600">해저드 +1</button>
  </div>

  <div style="flex: 1"></div>
  <div style="padding: 0 16px 22px; display: flex; gap: 10px">
    <button style="width: 110px; height: 56px; border-radius: 18px; border: 1.5px solid #CDD3C8; background: transparent; color: #18241D; font-size: 16px; font-weight: 600">이전 홀</button>
    <button style="flex: 1; height: 56px; border-radius: 18px; border: none; background: #18241D; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px">
      <span>다음 홀</span>
      <span style="font-size: 13px; font-weight: 500; opacity: 0.8">이 홀 5타 · 보기</span>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1F5C3F","options":["#1F5C3F","#0F4C5C","#2B3A55"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#1F5C3F';
    const holes = [];
    for (let i = 1; i <= 18; i++) {
      const bg = i < 7 ? accent : (i === 7 ? '#F2C14E' : '#DADFD4');
      holes.push({ style: 'flex: 1; height: 6px; border-radius: 3px; background: ' + bg + ';' });
    }
    const row = 'display: flex; align-items: center; gap: 8px; padding: 10px 0;';
    const divided = row + ' border-bottom: 1px solid #ECEFE7;';
    return {
      accent,
      holes,
      rows: [
        { label: '그린까지', hint: '티샷부터 그린 도착', value: 2, rowStyle: divided },
        { label: '숏게임', hint: '어프로치 · 칩샷', value: 1, rowStyle: divided },
        { label: '퍼팅', hint: '그린 위', value: 2, rowStyle: row }
      ]
    };
  }
}
</script>
</body>
</html>
